name: Product Description Agent

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product Name"
        required: true
        type: string

      artist:
        description: "Artist / Designer"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: string

      materials:
        description: "Materials"
        required: true
        type: string

      vendor_description:
        description: "Vendor Description"
        required: true
        type: string

      collection:
        description: "Collection"
        required: false
        type: string

      price:
        description: "Price"
        required: false
        type: string

      dimensions:
        description: "Dimensions"
        required: false
        type: string

      product_url:
        description: "Product URL"
        required: false
        type: string

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Product Report
        env:
          PRODUCT_NAME: ${{ github.event.inputs.product_name }}
          ARTIST: ${{ github.event.inputs.artist }}
          CATEGORY: ${{ github.event.inputs.category }}
          MATERIALS: ${{ github.event.inputs.materials }}
          VENDOR_DESCRIPTION: ${{ github.event.inputs.vendor_description }}
          COLLECTION: ${{ github.event.inputs.collection }}
          PRICE: ${{ github.event.inputs.price }}
          DIMENSIONS: ${{ github.event.inputs.dimensions }}
          PRODUCT_URL: ${{ github.event.inputs.product_url }}

        run: |
          python -m scripts.product_content_engine

      - name: Upload Product Report
        uses: actions/upload-artifact@v4
        with:
          name: product-description-report
          path: reports/products/product-description-report.md
