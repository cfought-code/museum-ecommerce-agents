name: Product Description Agent

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product Name"
        required: true
        type: string

      artist:
        description: "Artist / Designer"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: string

      materials:
        description: "Materials"
        required: true
        type: string

      vendor_description:
        description: "Vendor Description"
        required: true
        type: string

      collection:
        description: "Collection"
        required: false
        type: string

      price:
        description: "Price"
        required: false
        type: string

      dimensions:
        description: "Dimensions"
        required: false
        type: string

      product_url:
        description: "Product URL"
        required: false
        type: string

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Product Report
        run: |
          mkdir -p reports/products

          cat > reports/products/product-description-report.md << EOF
          # Product Description Agent Report

          ## Product Information

          **Product Name:** ${{ github.event.inputs.product_name }}

          **Artist:** ${{ github.event.inputs.artist }}

          **Category:** ${{ github.event.inputs.category }}

          **Materials:** ${{ github.event.inputs.materials }}

          **Collection:** ${{ github.event.inputs.collection }}

          **Price:** ${{ github.event.inputs.price }}

          **Dimensions:** ${{ github.event.inputs.dimensions }}

          **Product URL:** ${{ github.event.inputs.product_url }}

          ---

          ## Vendor Description

          ${{ github.event.inputs.vendor_description }}

          ---

          ## Suggested Shopify Product Title

          ${{ github.event.inputs.product_name }} by ${{ github.event.inputs.artist }}

          ---

          ## Short Description

          A thoughtfully designed piece that combines creativity, craftsmanship, and museum-quality appeal. Perfect for collectors, gift-givers, and design enthusiasts.

          ---

          ## Long Description

          Crafted from ${{ github.event.inputs.materials }}, ${{ github.event.inputs.product_name }} showcases the distinctive design approach of ${{ github.event.inputs.artist }}. Inspired by artistic expression and quality craftsmanship, this piece adds character and visual interest to any home, office, or collection. Its combination of form, function, and design makes it an excellent gift and a memorable addition to a museum-store assortment.

          ---

          ## SEO Meta Description

          Discover ${{ github.event.inputs.product_name }} by ${{ github.event.inputs.artist }}. Museum-quality design crafted from ${{ github.event.inputs.materials }}.

          ---

          ## Suggested Tags

          - museum store
          - artist made
          - design
          - gift
          - collectible
          - ${{ github.event.inputs.category }}

          ---

          ## Suggested Keywords

          - museum gift
          - artist designed
          - contemporary design
          - unique gift
          - home decor
          - collectible art

          ---

          ## Gift Guide Category

          - Gifts for Art Lovers
          - Home Decor
          - Museum Favorites

          ---

          ## Cross-Sell Opportunities

          - Artist books
          - Design objects
          - Decorative mobiles
          - Desk accessories
          - Museum-exclusive gifts

          EOF

      - name: Upload Product Report
        uses: actions/upload-artifact@v4
        with:
          name: product-description-report
          path: reports/products/product-description-report.md
