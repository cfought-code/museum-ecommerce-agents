name: Product Description Agent

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product Name"
        required: true
        type: string

      artist:
        description: "Artist / Designer"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: string

      materials:
        description: "Materials"
        required: true
        type: string

      vendor_description:
        description: "Vendor Description"
        required: true
        type: string

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Report
        run: |
          mkdir -p reports/products

          cat > reports/products/product-description-report.md << EOF
          # Product Description Report

          ## Product Name

          ${{ github.event.inputs.product_name }}

          ## Artist / Designer

          ${{ github.event.inputs.artist }}

          ## Category

          ${{ github.event.inputs.category }}

          ## Materials

          ${{ github.event.inputs.materials }}

          ## Vendor Description

          ${{ github.event.inputs.vendor_description }}

          ---

          ## Suggested Shopify Description

          Crafted from ${{ github.event.inputs.materials }}, this thoughtfully designed piece showcases the creative vision of ${{ github.event.inputs.artist }}. Ideal for collectors, design enthusiasts, and museum-store shoppers, ${{ github.event.inputs.product_name }} brings art and craftsmanship into everyday life.

          ## SEO Meta Description

          Discover ${{ github.event.inputs.product_name }} by ${{ github.event.inputs.artist }}, crafted from ${{ github.event.inputs.materials }} and perfect for design-focused living.

          ## Suggested Shopify Tags

          - museum store
          - art gift
          - design
          - collectible
          - ${{ github.event.inputs.category }}

          ## Suggested Keywords

          - museum gift
          - artist designed
          - home decor
          - unique gift
          - contemporary design

          EOF

      - name: Upload Product Report
        uses: actions/upload-artifact@v4
        with:
          name: product-description-report
          path: reports/products/product-description-report.md
